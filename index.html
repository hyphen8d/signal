<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIGNAL -- a CRT tuning-dial internet radio</title>
<meta name="description" content="A terminal/CRT tuning-dial radio receiver rendered entirely as text. 14 curated stations across two bands, real tracks, station idents, synced lyrics, scanning and presets -- spin the dial and leave it on.">
<meta name="author" content="Hyphen8d">
<meta name="theme-color" content="#000000">

<!-- Social cards. Without these, pasting the URL anywhere -- Slack, Discord,
     Mastodon, HN -- produces a bare link with no image and no description,
     which for a project whose whole appeal is visual is the worst possible
     first impression. og:image and og:url MUST be absolute: scrapers do not
     resolve relative paths. screenshots/og.jpg is the hero letterboxed to
     1200x630, the size every scraper crops to -- feeding it the 4:3 hero
     directly would centre-crop the top and bottom off the tube. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="SIGNAL">
<meta property="og:title" content="SIGNAL -- a CRT tuning-dial internet radio">
<meta property="og:description" content="A terminal/CRT tuning-dial radio receiver rendered entirely as text. 14 curated stations across two bands, real tracks, station idents, synced lyrics, scanning and presets -- spin the dial and leave it on.">
<meta property="og:url" content="https://hyphen8d.github.io/signal/">
<meta property="og:image" content="https://hyphen8d.github.io/signal/screenshots/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="SIGNAL's green-phosphor CRT screen, locked onto the COLD WAVE station.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SIGNAL -- a CRT tuning-dial internet radio">
<meta name="twitter:description" content="14 curated stations across two bands, real tracks, station idents, scanning and presets -- rendered entirely as text.">
<meta name="twitter:image" content="https://hyphen8d.github.io/signal/screenshots/og.jpg">

<!-- Favicon as an inline SVG data URI rather than a binary in the repo: it is
     nine elements, it scales, and it keeps the phosphor green the tube boots
     in (config.js PHOSPHORS.matrix). No .ico fallback -- every browser that
     can run WebGL2 can read this. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cg fill='none' stroke='%232eff5c' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M9.5 18.25a7.5 7.5 0 0 1 13 0'/%3E%3Cpath d='M4.74 15.5a13 13 0 0 1 22.52 0'/%3E%3C/g%3E%3Ccircle cx='16' cy='22' r='2.6' fill='%232eff5c'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: none;
    /* 22nd pass -- basic mobile functionality: tap to power on,
       swipe left/right for channels. Without this, iOS/Android treat
       swipes on the canvas as page-pan/pinch-zoom gestures (there's no
       scrollable content, but touch-action defaults to allowing them
       anyway), which fights the custom tap/swipe handling in program.js
       and can trigger Safari's edge-swipe back/forward navigation. */
    touch-action: none;
  }
  #fault {
    position: fixed;
    inset: 0;
    display: none;
    padding: 2rem;
    color: #ffb000;
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
  }
  /* Docked off-screen rather than display:none -- this is an audio-focused
     experience, so the video itself is never meant to be seen, only heard,
     with the terminal as the only visible UI. Off-screen (not
     display:none/visibility:hidden) rather than fully hidden, since some
     browsers pause or throttle iframed video once it's completely hidden
     rather than just moved out of the viewport. */
  #ytDock {
    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 260px;
    height: 200px;
  }
</style>
</head>
<body>
  <canvas id="tube"></canvas>
  <div id="ytDock"></div>
  <pre id="fault"></pre>
  <script>
    // Must exist before the iframe_api script below finishes its own async
    // load, or the callback fires into nothing and no player is ever built.
    // program.js queues its player-creation function here instead of
    // assigning this global itself, so timing can't race it.
    window.SIGNAL_YT_READY = false;
    window.SIGNAL_YT_QUEUE = [];
    window.onYouTubeIframeAPIReady = function () {
      window.SIGNAL_YT_READY = true;
      window.SIGNAL_YT_QUEUE.forEach(fn => fn());
      window.SIGNAL_YT_QUEUE = [];
    };
  </script>
  <!-- async (2026-08-25 audit): this was parser-blocking ahead of main.js,
       so first paint waited on youtube.com. The SIGNAL_YT_QUEUE handshake
       above already copes with the API landing before OR after program.js
       (see initPlayer), so load order genuinely doesn't matter. -->
  <script src="https://www.youtube.com/iframe_api" async></script>
  <script type="module" src="./main.js"></script>
  <!-- Cloudflare Web Analytics (2026-08-31). Page-level only: how many
       people arrive, roughly where from, and on what. It sets no cookies
       and reads no client-side state, which is why it needs no consent
       card and why the tip jar's wording below stays honest with it here.

       What it deliberately does NOT answer: anything about what a listener
       DOES. SIGNAL is one URL that then runs for hours, and this counts
       page loads -- so every session reads as a single view whether someone
       bounced in ten seconds or left COLD WAVE on all afternoon. Station
       share, session length and feature discovery need events from inside
       the state machine; that was built, shipped switched off, and rolled
       back on 2026-08-31 because turning it on cost a Cloudflare Worker, a
       KV namespace and six steps for one number. See fd5072d if it ever
       comes back -- and do not expect this snippet to grow into it, because
       Cloudflare Web Analytics has no custom events at all.

       Read the numbers as a FLOOR, not a count. This host is on the common
       blocklists, and an audience that likes a terminal-shaped radio is an
       audience disproportionately likely to be running uBlock. -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "42f7b00641bc4501826669a678e3a4ab"}'></script>
</body>
</html>
