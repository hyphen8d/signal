name: Track or station suggestion
description: Propose a song for a station, or a whole station that doesn't exist yet
labels: ["track suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are genuinely wanted -- the roster is hand-curated, and
        the best additions have come from people who know a lane better than
        I do. Four things that will get a proposal accepted faster:

        - **Every station has a lane, and the lane is narrower than the
          genre.** COLD WAVE is not "synth music", it's synthetic hearts and
          borrowed neon. Say why yours belongs on *that* station rather than
          on a different one. If it fits three stations equally well, it
          probably fits none of them.
        - **Breadth is the tiebreaker, not a quota.** An artist already on a
          station has a higher bar, not a closed door -- about one track in
          five across the roster is a second or third from someone already
          there, and CIPHER alone carries four Prodigy tracks. So propose the
          banger. Just tell me what it does that the one already there
          doesn't, because that's the case it has to win.
        - **It has to be on YouTube, playable, and embeddable.** Every ID on
          the roster is verified before it lands (alive, US-available,
          embeddable, the right recording and not a live take or an edit).
          A link saves me guessing which upload you meant.
        - **A swap is a fair thing to propose.** If something already on the
          station strikes you as out of lane, name it under "Anything you'd
          swap out for it". That's the way to argue for pulling a track --
          a slot is a slot, and "cut this one" with nothing behind it just
          leaves the station shorter.

        The full roster, with every station's taglines and track list, is in
        [stations.md](https://github.com/hyphen8d/signal/blob/main/stations.md).
        Worth a skim so you don't propose something already on there.

  - type: dropdown
    id: station
    attributes:
      label: Which station
      description: >
        Pick "A new station" if this doesn't belong on any of them. Fair
        warning -- the ceiling is nine per band, since the presets are the
        `1`-`9` keys on each band, so a new station on a full band means
        retiring an existing one.
      # tools/lint-roster.js asserts this list against stations.js (every
      # public station present as "<BAND>-<preset> <CALLSIGN> -- ...", no
      # option naming a station that is gone, and the "per band" ceiling
      # above). This form sat on the nine-station, one-band roster for two
      # weeks after the second band landed -- 2026-09-12 audit, M13.
      options:
        - YM-1 CIPHER -- digital infiltration, late-night breakbeat
        - YM-2 DISTORTION FIELD -- raw nerve, '90s angst
        - YM-3 COLD WAVE -- synthetic hearts, borrowed neon
        - YM-4 NEON STASIS -- closing time in a mall that never was
        - YM-5 RISE UP -- protest anthems, sung back by the room
        - YM-6 ATOMIC -- atomic swing, radioactive nostalgia
        - YM-7 CITY LIGHTS -- tokyo nights, city pop dreams
        - YM-8 HACKBACK -- golden age hip-hop, coast to coast legends
        - ZM-1 THE CRYPT -- a ruin, a keep, a tape left running
        - ZM-2 SLOW ORBIT -- downtempo grooves, no hurry at all
        - ZM-3 AFTER HOURS -- the last set, brushes and blue notes
        - ZM-4 SYNAPSE -- shifting the plates of the underground
        - ZM-5 DRIFT MODE -- fade to black, ambient descent
        - ZM-6 TRADEWINDS -- vintage island rhythms, cocktail in hand
        - ZM-7 CIRCUIT CRUSH -- analog glow, the long drive home
        - A new station
    validations:
      required: true

  - type: textarea
    id: tracks
    attributes:
      label: The track(s)
      description: >
        Artist and title. A YouTube link each if you have them -- prefer the
        artist's own channel, a VEVO upload or a "- Topic" upload over a fan
        re-upload, since those are what survive.
      placeholder: |
        Blue Monday '88 -- New Order
        https://www.youtube.com/watch?v=...
      render: text
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it fits that station
      description: >
        The useful part. What does it have in common with what's already
        there -- the sound, the era, the mood it puts you in at 2am?
    validations:
      required: true

  - type: textarea
    id: swap
    attributes:
      label: Anything you'd swap out for it
      description: >
        Optional, and only if something on that station feels wrong to you.
        Name the track and say what's off about the fit -- the era, the
        tempo, the hour of the night it belongs to. The lane test cuts both
        directions: a track that would sit equally well on three stations
        isn't really at home on any of them.
      placeholder: |
        Swap for: Some Track -- Some Artist
        Right era, but it's a daylight song and the rest of the station
        is 2am.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: >
            I've checked stations.md -- this exact track isn't already on the
            station I'm suggesting it for.
          required: false
        - label: >
            I know SIGNAL plays real YouTube video, so this needs to be
            something that's actually up there and embeddable.
          required: false
