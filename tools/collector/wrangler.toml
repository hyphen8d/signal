# SIGNAL session-summary collector.
#
#   npx wrangler kv namespace create SIGNAL_STATS   # paste the id below
#   npx wrangler secret put READ_TOKEN              # any long random string
#   npx wrangler deploy
#
# Then, in the repo:
#   1. config.js   -- set METRICS_ENDPOINT to https://<worker>/collect
#   2. admin-server -- export SIGNAL_STATS_URL=https://<worker>/stats
#                      export SIGNAL_STATS_TOKEN=<the READ_TOKEN>
#      (in the systemd unit, or the shell that starts it)
#   3. node tools/stamp.js && deploy
#
# Until step 1, the site sends nothing and none of this does anything.

name = "signal-collector"
main = "worker.js"
compatibility_date = "2026-08-31"

# One entry per day plus short-lived rate-limit keys. Free-tier KV is far
# more than this needs -- the whole point of aggregating on write is that
# storage does not grow with traffic.
[[kv_namespaces]]
binding = "SIGNAL_STATS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# READ_TOKEN is a secret, set with `wrangler secret put` -- never here.
# This file is committed; secrets in it would be committed too.
